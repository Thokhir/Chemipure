<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Page - ChemiPure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header -->

    <div class="container py-5">
        <h2>Welcome, Demo User</h2>

        <ul class="nav nav-tabs mt-4">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#enquiries">My Enquiries</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#history">Purchase History</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#saved">Save For Later</a></li>
        </ul>

        <div class="tab-content mt-4">
            <div id="enquiries" class="tab-pane active">
                <div class="row" id="inquiry-container"></div>
            </div>
            <div id="history" class="tab-pane">
                <p class="text-muted">No purchase history yet.</p>
            </div>
            <div id="saved" class="tab-pane">
                <div class="row" id="saved-container"></div>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
    <script>
        window.onload = () => {
            renderInquiryList();
            // Render Save For Later
            const savedCont = document.getElementById('saved-container');
            saveLater.forEach(item => {
                savedCont.innerHTML += `<div class="col-md-3 mb-3"><div class="card"><img src="${item.img}"><div class="card-body"><h6>${item.name}</h6></div></div></div>`;
            });
        };
    </script>

    <!-- Footer -->
</body>
</html>
