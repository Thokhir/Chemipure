<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulk Enquiry - ChemiPure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- TOP BLACK STRIP + MAIN NAV -->

    <div class="container py-5">
        <h2 class="mb-4">Inquiry</h2>
        
        <table class="table table-bordered align-middle" id="enquiryTable">
            <thead class="table-light">
                <tr>
                    <th>Category</th>
                    <th>Product</th>
                    <th>Quantity (g)</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <button onclick="addRow()" class="btn btn-secondary mb-4">+ Add Compound</button>

        <!-- Rest of the form (Name, Phone, Email, Detailed, Attachment) same as your screenshot -->
        <!-- Paste your previous bulk-enquiry form fields here below the table -->

        <div class="text-end mt-4">
            <button class="btn btn-primary px-5" style="background:#0052cc;">Inquiry</button>
            <button class="btn btn-secondary px-5 ms-3">Cancel</button>
        </div>
    </div>

    <!-- Footer -->

    <script src="assets/js/script.js"></script>
    <script>
        function addRow() {
            const tbody = document.querySelector('#enquiryTable tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <select class="form-select" onchange="populateProducts(this)">
                        <option value="">Select Category</option>
                        <option value="API">API</option>
                        <option value="Linkers">Linkers</option>
                        <option value="Custom Synthesis">Custom Synthesis</option>
                        <option value="Drug Discovery">Drug Discovery</option>
                    </select>
                </td>
                <td>
                    <select class="form-select product-select"><option>Select Product</option></select>
                </td>
                <td><input type="number" class="form-control" placeholder="Quantity"></td>
                <td><button class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">×</button></td>
            `;
            tbody.appendChild(row);
        }

        function populateProducts(select) {
            const category = select.value;
            const productSelect = select.closest('tr').querySelector('.product-select');
            productSelect.innerHTML = '<option>Select Product</option>';
            
            const filtered = products.filter(p => p.category === category);
            filtered.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.name + ' (CAS: ' + p.cas + ')';
                productSelect.appendChild(opt);
            });
        }

        // Add one row by default
        window.onload = () => { addRow(); };
    </script>
</body>
</html>
