<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulk Enquiry - ChemiPure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Same Header -->

    <div class="container py-5">
        <h2>Bulk Enquiry</h2>
        <form class="mt-4">
            <div class="row">
                <div class="col-md-6">
                    <input type="text" class="form-control mb-3" placeholder="Your Name" required>
                    <input type="email" class="form-control mb-3" placeholder="Email" required>
                    <input type="text" class="form-control mb-3" placeholder="Company Name">
                </div>
                <div class="col-md-6">
                    <input type="tel" class="form-control mb-3" placeholder="Phone">
                    <textarea class="form-control" rows="3" placeholder="Additional Message"></textarea>
                </div>
            </div>

            <h5 class="mt-4">Compounds Required</h5>
            <table class="table table-bordered" id="compoundTable">
                <thead><tr><th>Compound Name</th><th>CAS Number</th><th>Quantity (g)</th><th>Remarks</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
            <button type="button" class="btn btn-secondary" onclick="addCompoundRow()">+ Add Compound</button>

            <button type="submit" class="btn btn-inquiry btn-lg mt-4">Submit Bulk Enquiry</button>
        </form>
    </div>

    <script>
        function addCompoundRow() {
            const tbody = document.querySelector('#compoundTable tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" class="form-control"></td>
                <td><input type="text" class="form-control"></td>
                <td><input type="number" class="form-control"></td>
                <td><input type="text" class="form-control"></td>
                <td><button class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">×</button></td>
            `;
            tbody.appendChild(row);
        }
        window.onload = () => { addCompoundRow(); }; // one row by default
    </script>

    <!-- Footer -->
</body>
</html>
