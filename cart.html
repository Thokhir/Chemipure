<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart - ChemiPure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- TOP BLACK STRIP + MAIN NAV -->

    <div class="container py-5">
        <h2>Your Cart</h2>
        <div id="cart-items" class="row"></div>
        <div class="mt-4 text-end">
            <button onclick="alert('Proceeding to checkout...')" class="btn btn-success btn-lg">Checkout</button>
        </div>
    </div>

    <!-- Footer -->

    <script src="assets/js/script.js"></script>
    <script>
        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            cart.forEach((item, i) => {
                container.innerHTML += `
                <div class="col-md-3 mb-4">
                    <div class="card">
                        <img src="${item.img}" class="card-img-top">
                        <div class="card-body">
                            <h5>${item.name}</h5>
                            <button onclick="cart.splice(${i},1); localStorage.setItem('cart', JSON.stringify(cart)); location.reload();" class="btn btn-danger btn-sm">Remove</button>
                        </div>
                    </div>
                </div>`;
            });
        }
        window.onload = renderCart;
    </script>
</body>
</html>
