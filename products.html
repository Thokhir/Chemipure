<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products - ChemiPure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- TOP BLACK STRIP + MAIN NAV (copy exactly from index.html or about.html) -->

    <div class="container py-5">
        <h2 class="mb-4">All Products</h2>
        <div class="row" id="product-grid"></div>
    </div>

    <!-- Footer -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        function renderProducts() {
            const container = document.getElementById('product-grid');
            container.innerHTML = '';
            products.forEach(p => {
                container.innerHTML += `
                <div class="col-lg-3 col-md-4 mb-4">
                    <div class="card h-100">
                        <img src="${p.img}" class="card-img-top" style="height:220px; object-fit:cover;">
                        <div class="card-body">
                            <h5>${p.name}</h5>
                            <p class="text-muted">CAS: ${p.cas}</p>
                            <div class="d-flex gap-2">
                                <button onclick="addToCart(${p.id}); event.stopImmediatePropagation();" class="btn btn-success btn-sm flex-fill">Add to Cart</button>
                                <button onclick="addToInquiry(${p.id}); event.stopImmediatePropagation();" class="btn btn-primary btn-sm flex-fill">Inquiry</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }
        window.onload = renderProducts;
    </script>
</body>
</html>
