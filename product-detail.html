<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Detail - ChemiPure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- TOP BLACK STRIP + MAIN NAV (copy from index.html) -->

    <div class="container py-5">
        <div class="row">
            <div class="col-md-6">
                <img id="prod-img" class="img-fluid rounded shadow" alt="">
            </div>
            <div class="col-md-6">
                <h2 id="prod-name"></h2>
                <p><strong>CAS:</strong> <span id="prod-cas"></span></p>
                <p id="prod-desc"></p>
                <div class="mt-4 d-flex gap-3">
                    <button onclick="addToCart(currentProductId)" class="btn btn-success btn-lg">Add to Cart</button>
                    <button onclick="addToInquiryAndGo()" class="btn btn-primary btn-lg">Inquiry →</button>
                    <button onclick="saveForLaterAndGo()" class="btn btn-outline-secondary btn-lg">Save for Later →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer (copy from index.html) -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script> window.onload = loadProductDetail; </script>
</body>
</html>
